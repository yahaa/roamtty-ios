<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Roamtty iOS architecture diagram across App, Swift packages, native C layer, and remote host">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .group { font-size: 12px; font-weight: 700; letter-spacing: 0.4px; }
      .title { font-size: 13.5px; font-weight: 700; fill: #F2F4F7; }
      .sub { font-size: 11.5px; font-weight: 500; fill: #9CA3AF; }
      .pill { font-size: 10.5px; font-weight: 600; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7D8596"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#7AA2F7"/>
    </marker>
    <marker id="arr-peach" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#E6A17E"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="918" height="438" rx="16" fill="#1A1C20" stroke="#2E323A" stroke-width="1.5"/>

  <!-- TIER 1: App Targets -->
  <rect x="28" y="24" width="864" height="118" rx="13" fill="#21242A" stroke="#393F4C" stroke-width="1.2"/>
  <text x="46" y="46" class="mono group" fill="#E6A17E">App/  (iOS Targets)</text>

  <!-- SwiftUI + UIKit -->
  <rect x="46" y="60" width="248" height="66" rx="10" fill="#2A2E36" stroke="#424957"/>
  <text x="64" y="86" class="sans title">SwiftUI + UIKit</text>
  <text x="64" y="106" class="sans sub">SwiftTerm · VideoToolbox</text>

  <!-- AppModel + Services -->
  <rect x="336" y="60" width="248" height="66" rx="10" fill="#2A2E36" stroke="#E6A17E" stroke-width="1.2"/>
  <text x="354" y="86" class="sans title">AppModel + Services</text>
  <text x="354" y="106" class="sans sub">Pool · Monitor · Reachability</text>

  <!-- RoamttyShare -->
  <rect x="626" y="60" width="248" height="66" rx="10" fill="#2A2E36" stroke="#6BBF8A" stroke-width="1.2"/>
  <text x="644" y="86" class="sans title">RoamttyShare</text>
  <text x="644" y="106" class="sans sub">Share Ext · Keychain / App Group</text>

  <line x1="298" y1="93" x2="332" y2="93" stroke="#7D8596" stroke-width="1.6" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <line x1="588" y1="93" x2="622" y2="93" stroke="#7D8596" stroke-width="1.6" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>

  <!-- TIER 2: Swift Packages + CNative -->
  <!-- RoamttyTransport -->
  <rect x="28" y="182" width="204" height="96" rx="12" fill="#23262C" stroke="#7AA2F7" stroke-width="1.2"/>
  <rect x="164" y="194" width="56" height="20" rx="6" fill="#1F283B"/>
  <text x="192" y="208" text-anchor="middle" class="mono pill" fill="#A9C3FF">Swift</text>
  <text x="42" y="210" class="mono title">Transport</text>
  <text x="42" y="236" class="sans sub">SSH · SFTP · mosh</text>
  <text x="42" y="256" class="sans sub">PortTunnel</text>

  <!-- RoamttyDesktopCore -->
  <rect x="248" y="182" width="204" height="96" rx="12" fill="#23262C" stroke="#E6A17E" stroke-width="1.2"/>
  <rect x="384" y="194" width="56" height="20" rx="6" fill="#332721"/>
  <text x="412" y="208" text-anchor="middle" class="mono pill" fill="#F3C3A8">Swift</text>
  <text x="262" y="210" class="mono title">DesktopCore</text>
  <text x="262" y="236" class="sans sub">UDP · RS-FEC · GCC</text>
  <text x="262" y="256" class="sans sub">Gestures · HID Keys</text>

  <!-- RoamttyCore -->
  <rect x="468" y="182" width="204" height="96" rx="12" fill="#23262C" stroke="#6BBF8A" stroke-width="1.2"/>
  <rect x="604" y="194" width="56" height="20" rx="6" fill="#1F2E26"/>
  <text x="632" y="208" text-anchor="middle" class="mono pill" fill="#8CD9A8">Swift</text>
  <text x="482" y="210" class="mono title">RoamttyCore</text>
  <text x="482" y="236" class="sans sub">SQLite · Keychain · Pins</text>
  <text x="482" y="256" class="sans sub">Hooks · Highlight · MD</text>

  <!-- CNative -->
  <rect x="688" y="182" width="204" height="96" rx="12" fill="#23262C" stroke="#E9C46A" stroke-width="1.2"/>
  <rect x="830" y="194" width="50" height="20" rx="6" fill="#312B1E"/>
  <text x="855" y="208" text-anchor="middle" class="mono pill" fill="#F5D98E">C</text>
  <text x="702" y="210" class="mono title">CNative</text>
  <text x="702" y="236" class="sans sub">libssh2 · OpenSSL</text>
  <text x="702" y="256" class="sans sub">SQLite · Session Heap</text>

  <!-- Vertical Connectors Tier 1 -> Tier 2 -->
  <line x1="130" y1="142" x2="130" y2="178" stroke="#7AA2F7" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <line x1="350" y1="142" x2="350" y2="178" stroke="#E6A17E" stroke-width="1.6" marker-end="url(#arr-peach)"/>
  <line x1="570" y1="142" x2="570" y2="178" stroke="#7D8596" stroke-width="1.6" marker-end="url(#arr-gray)"/>
  <line x1="672" y1="230" x2="684" y2="230" stroke="#E9C46A" stroke-width="1.6" marker-end="url(#arr-gray)"/>

  <!-- TIER 3: Remote Host -->
  <rect x="28" y="328" width="864" height="90" rx="13" fill="#21242A" stroke="#393F4C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="460" y="348" text-anchor="middle" class="mono group" fill="#9CA3AF">REMOTE HOST  ·  Linux / macOS / Windows</text>

  <rect x="46" y="360" width="248" height="44" rx="9" fill="#2A2E36" stroke="#3D4452"/>
  <text x="170" y="387" text-anchor="middle" class="sans title">OpenSSH · SFTP · mosh</text>

  <rect x="336" y="360" width="248" height="44" rx="9" fill="#2A2E36" stroke="#3D4452"/>
  <text x="460" y="387" text-anchor="middle" class="sans title">tmux / psmux · AI Hooks</text>

  <rect x="626" y="360" width="248" height="44" rx="9" fill="#2A2E36" stroke="#3D4452"/>
  <text x="750" y="387" text-anchor="middle" class="sans title">roamtty-desktop</text>

  <!-- Internal host arrow -->
  <line x1="298" y1="382" x2="332" y2="382" stroke="#7D8596" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Vertical Connectors Tier 2 -> Tier 3 -->
  <line x1="130" y1="278" x2="130" y2="356" stroke="#7AA2F7" stroke-width="1.8" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <rect x="92" y="294" width="76" height="22" rx="11" fill="#1F283B" stroke="#7AA2F7" stroke-width="1"/>
  <text x="130" y="309" text-anchor="middle" class="mono pill" fill="#A9C3FF">TCP / UDP</text>

  <path d="M 350 278 L 350 305 L 750 305 L 750 356" fill="none" stroke="#E6A17E" stroke-width="1.8" marker-start="url(#arr-peach)" marker-end="url(#arr-peach)"/>
  <rect x="502" y="294" width="96" height="22" rx="11" fill="#332721" stroke="#E6A17E" stroke-width="1"/>
  <text x="550" y="309" text-anchor="middle" class="mono pill" fill="#F3C3A8">SSH / UDP</text>
</svg>
