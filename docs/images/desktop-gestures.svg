<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380" role="img" aria-label="Roamtty remote desktop gesture cheat sheet">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1 { font-size: 16px; font-weight: 700; fill: #F2F4F7; }
      .card-title { font-size: 14px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 600; fill: #E5E7EB; }
      .sub { font-size: 11.5px; font-weight: 500; fill: #9CA3AF; }
      .badge { font-size: 11.5px; font-weight: 600; fill: #9CA3AF; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="918" height="378" rx="16" fill="#1A1C20" stroke="#2E323A" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" class="sans h1">Remote Desktop Gestures</text>
  <rect x="708" y="21" width="180" height="28" rx="14" fill="#23262C" stroke="#353A45"/>
  <text x="798" y="39" text-anchor="middle" class="sans badge">Fingers = Mouse Button</text>

  <!-- CARD 1: TAP (Top-Left) -->
  <rect x="32" y="64" width="420" height="140" rx="13" fill="#23262C" stroke="#353A45" stroke-width="1.2"/>
  <text x="52" y="90" class="sans card-title" fill="#7AA2F7">Tap</text>

  <!-- 1 Finger -->
  <rect x="50" y="106" width="118" height="82" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <circle cx="109" cy="130" r="8" fill="#7AA2F7"/>
  <text x="109" y="158" text-anchor="middle" class="sans label">Left Click</text>
  <text x="109" y="175" text-anchor="middle" class="sans sub">2× Double</text>

  <!-- 2 Fingers -->
  <rect x="183" y="106" width="118" height="82" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <circle cx="231" cy="130" r="8" fill="#7AA2F7"/>
  <circle cx="253" cy="130" r="8" fill="#7AA2F7"/>
  <text x="242" y="158" text-anchor="middle" class="sans label">Right Click</text>
  <text x="242" y="175" text-anchor="middle" class="sans sub">2 Fingers</text>

  <!-- 3 Fingers -->
  <rect x="316" y="106" width="118" height="82" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <circle cx="355" cy="130" r="7.5" fill="#7AA2F7"/>
  <circle cx="375" cy="130" r="7.5" fill="#7AA2F7"/>
  <circle cx="395" cy="130" r="7.5" fill="#7AA2F7"/>
  <text x="375" y="158" text-anchor="middle" class="sans label">Middle Click</text>
  <text x="375" y="175" text-anchor="middle" class="sans sub">3 Fingers</text>

  <!-- CARD 2: HOLD (Top-Right) -->
  <rect x="468" y="64" width="420" height="140" rx="13" fill="#23262C" stroke="#353A45" stroke-width="1.2"/>
  <text x="488" y="90" class="sans card-title" fill="#E9C46A">Hold</text>
  <text x="530" y="90" class="sans sub">Ring fills + haptic</text>

  <!-- 1-Finger Hold -->
  <rect x="486" y="106" width="186" height="82" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <circle cx="518" cy="147" r="16" fill="none" stroke="#7AA2F7" stroke-width="2.5"/>
  <circle cx="518" cy="147" r="7" fill="#7AA2F7"/>
  <text x="544" y="133" class="sans label">Lift → Right</text>
  <text x="544" y="153" class="sans label">Move → Drag</text>
  <text x="544" y="175" class="sans sub">Blue · 350 ms</text>

  <!-- 2-Finger Hold -->
  <rect x="686" y="106" width="184" height="82" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <circle cx="724" cy="147" r="17" fill="none" stroke="#E07A7A" stroke-width="2.5"/>
  <circle cx="717" cy="147" r="5.5" fill="#E07A7A"/>
  <circle cx="731" cy="147" r="5.5" fill="#E07A7A"/>
  <text x="752" y="143" class="sans label">Right Drag</text>
  <text x="752" y="165" class="sans sub">Red ring · 500 ms</text>

  <!-- CARD 3: SCROLL & ZOOM (Bottom-Left) -->
  <rect x="32" y="220" width="420" height="136" rx="13" fill="#23262C" stroke="#353A45" stroke-width="1.2"/>
  <text x="52" y="246" class="sans card-title" fill="#6BBF8A">Scroll &amp; Zoom</text>

  <!-- 2-Finger Slide -->
  <rect x="50" y="262" width="118" height="78" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <circle cx="94" cy="285" r="6" fill="#6BBF8A"/>
  <circle cx="110" cy="285" r="6" fill="#6BBF8A"/>
  <text x="128" y="290" class="sans label" fill="#8CD9A8">↕</text>
  <text x="109" y="313" text-anchor="middle" class="sans label">Scroll</text>
  <text x="109" y="329" text-anchor="middle" class="sans sub">With inertia</text>

  <!-- Pinch -->
  <rect x="183" y="262" width="118" height="78" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <path d="M 230 294 L 222 294 L 222 286 M 222 294 L 234 282" fill="none" stroke="#6BBF8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 254 276 L 262 276 L 262 284 M 262 276 L 250 288" fill="none" stroke="#6BBF8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="242" y="313" text-anchor="middle" class="sans label">Pinch</text>
  <text x="242" y="329" text-anchor="middle" class="sans sub">Zoom up to 5×</text>

  <!-- 2-Finger Double Tap -->
  <rect x="316" y="262" width="118" height="78" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <text x="352" y="290" class="mono label" fill="#8CD9A8">2×</text>
  <circle cx="384" cy="285" r="5.5" fill="#6BBF8A"/>
  <circle cx="399" cy="285" r="5.5" fill="#6BBF8A"/>
  <text x="375" y="313" text-anchor="middle" class="sans label">Quick Zoom</text>
  <text x="375" y="329" text-anchor="middle" class="sans sub">Toggle 2.5×</text>

  <!-- CARD 4: 3-FINGER & EDGES (Bottom-Right) -->
  <rect x="468" y="220" width="420" height="136" rx="13" fill="#23262C" stroke="#353A45" stroke-width="1.2"/>
  <text x="488" y="246" class="sans card-title" fill="#E6A17E">3-Finger &amp; Edges</text>

  <!-- 3-finger swipes -->
  <rect x="486" y="262" width="174" height="78" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <text x="500" y="286" class="mono label" fill="#E6A17E">3↑</text>
  <text x="526" y="286" class="sans sub">All Windows</text>
  <text x="500" y="307" class="mono label" fill="#E6A17E">3↓</text>
  <text x="526" y="307" class="sans sub">Show Desktop</text>
  <text x="500" y="328" class="mono label" fill="#E6A17E">3↔</text>
  <text x="526" y="328" class="sans sub">Switch Space</text>

  <!-- Edges -->
  <rect x="672" y="262" width="198" height="78" rx="9" fill="#2B2F37" stroke="#3A404D"/>
  <!-- Mini screen with bars -->
  <rect x="684" y="279" width="38" height="44" rx="5" fill="#131518" stroke="#4A5060"/>
  <rect x="691" y="281" width="24" height="40" rx="2" fill="#283142" stroke="#E6A17E" stroke-width="1.2"/>
  <text x="734" y="290" class="sans label">Frame Edge</text>
  <text x="734" y="308" class="sans sub">Dock / Taskbar</text>
  <text x="734" y="327" class="sans sub">Black Bar → Back</text>
</svg>
