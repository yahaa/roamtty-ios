<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="Roamtty terminal touch gestures and Ghost toolbox diagram">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-size: 13.5px; font-weight: 700; fill: #F2F4F7; }
      .sub { font-size: 11.5px; font-weight: 500; fill: #9CA3AF; }
      .tag { font-size: 11px; font-weight: 600; }
      .term { font-size: 11px; font-weight: 500; fill: #8E95A2; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="918" height="438" rx="16" fill="#1A1C20" stroke="#2E323A" stroke-width="1.5"/>

  <!-- Center Phone Frame -->
  <rect x="322" y="24" width="276" height="392" rx="30" fill="#131518" stroke="#424856" stroke-width="2"/>
  <rect x="424" y="34" width="72" height="5" rx="2.5" fill="#2E333D"/>
  <!-- Screen Area -->
  <rect x="334" y="48" width="252" height="354" rx="18" fill="#1E2025" stroke="#2D313B" stroke-width="1"/>

  <!-- Stylized Minimal Terminal Content -->
  <text x="350" y="74" class="mono tag" fill="#E6A17E">✳ Claude Code</text>
  <text x="454" y="74" class="mono term">~/app</text>
  <rect x="350" y="88" width="160" height="6" rx="3" fill="#323743"/>
  <rect x="350" y="102" width="206" height="6" rx="3" fill="#2A2F3A"/>
  <rect x="350" y="116" width="132" height="6" rx="3" fill="#264032"/>
  <rect x="350" y="130" width="174" height="6" rx="3" fill="#264032"/>

  <!-- Center Gesture Visual Overlay -->
  <g transform="translate(442, 212)">
    <!-- Vertical scroll arrows -->
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#6BBF8A" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M -5 -38 L 0 -46 L 5 -38" fill="none" stroke="#6BBF8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -5 38 L 0 46 L 5 38" fill="none" stroke="#6BBF8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Horizontal arrows -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#7AA2F7" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M -48 -5 L -56 0 L -48 5" fill="none" stroke="#7AA2F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 48 -5 L 56 0 L 48 5" fill="none" stroke="#7AA2F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center touch ring -->
    <circle cx="0" cy="0" r="14" fill="#23262C" stroke="#E6A17E" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="4" fill="#E6A17E"/>
  </g>

  <!-- Ghost Emblem on Right Edge -->
  <g transform="translate(550, 174)">
    <circle cx="16" cy="16" r="21" fill="#332721" stroke="#E6A17E" stroke-width="1.6"/>
    <!-- Simple Cute Ghost Silhouette -->
    <path d="M 8 24 V 14 A 8 8 0 0 1 24 14 V 24 L 21 21.5 L 18.5 24 L 16 21.5 L 13.5 24 L 11 21.5 Z" fill="#F2F4F7"/>
    <circle cx="13.5" cy="14" r="1.5" fill="#1E2025"/>
    <circle cx="18.5" cy="14" r="1.5" fill="#1E2025"/>
  </g>

  <!-- Bottom Cursor Row -->
  <rect x="344" y="346" width="232" height="40" rx="10" fill="#262930" stroke="#E6A17E" stroke-width="1.5"/>
  <text x="358" y="370" class="mono label" fill="#9CA3AF">&gt;</text>
  <rect x="373" y="357" width="8" height="17" rx="1.5" fill="#E6A17E"/>
  <!-- Esc / Enter Pill -->
  <rect x="514" y="353" width="54" height="26" rx="7" fill="#343944" stroke="#E9C46A" stroke-width="1.2"/>
  <text x="541" y="370" text-anchor="middle" class="mono tag" fill="#F5D98E">Esc / ↵</text>

  <!-- LEFT CALLOUTS -->
  <!-- 1: Multi-tap -->
  <rect x="28" y="40" width="248" height="64" rx="11" fill="#23262C" stroke="#353A45" stroke-width="1.1"/>
  <rect x="40" y="50" width="60" height="20" rx="6" fill="#2D323D"/>
  <text x="70" y="64" text-anchor="middle" class="mono tag" fill="#F2F4F7">2× Tap</text>
  <text x="110" y="64" class="sans sub">Tab Completion</text>
  <rect x="40" y="76" width="60" height="20" rx="6" fill="#2D323D"/>
  <text x="70" y="90" text-anchor="middle" class="mono tag" fill="#F2F4F7">3× Tap</text>
  <text x="110" y="90" class="sans sub">Paste Clipboard</text>
  <line x1="276" y1="72" x2="334" y2="108" stroke="#474E5E" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 2: Vertical Swipe -->
  <rect x="28" y="118" width="248" height="54" rx="11" fill="#23262C" stroke="#353A45" stroke-width="1.1"/>
  <circle cx="48" cy="145" r="11" fill="#1F2E26" stroke="#6BBF8A" stroke-width="1.2"/>
  <text x="48" y="149" text-anchor="middle" class="sans tag" fill="#8CD9A8">↕</text>
  <text x="70" y="141" class="sans label">Swipe Up / Down</text>
  <text x="70" y="159" class="sans sub">Scrollback / tmux History</text>
  <line x1="276" y1="145" x2="438" y2="178" stroke="#6BBF8A" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- 3: Horizontal Swipe -->
  <rect x="28" y="188" width="248" height="58" rx="11" fill="#23262C" stroke="#353A45" stroke-width="1.1"/>
  <circle cx="48" cy="217" r="11" fill="#1F283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="48" y="221" text-anchor="middle" class="sans tag" fill="#A9C3FF">↔</text>
  <text x="70" y="212" class="sans label">Swipe Left / Right</text>
  <text x="70" y="231" class="sans sub">← / →   ·   Hold: Home / End</text>
  <line x1="276" y1="217" x2="386" y2="212" stroke="#7AA2F7" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7"/>

  <!-- 4: Pinch & Long-Press -->
  <rect x="28" y="262" width="248" height="58" rx="11" fill="#23262C" stroke="#353A45" stroke-width="1.1"/>
  <text x="44" y="286" class="sans label">Pinch</text>
  <text x="108" y="286" class="sans sub">Font Size</text>
  <text x="44" y="307" class="sans label">Hold</text>
  <text x="108" y="307" class="sans sub">Drag Cursor / Copy</text>
  <line x1="276" y1="291" x2="344" y2="275" stroke="#474E5E" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 5: Tap Cursor Row -->
  <rect x="28" y="336" width="248" height="60" rx="11" fill="#23262C" stroke="#E6A17E" stroke-width="1.2"/>
  <text x="44" y="361" class="sans label">Tap Cursor Row</text>
  <text x="44" y="381" class="sans sub">Toggle Keyboard</text>
  <line x1="276" y1="366" x2="344" y2="366" stroke="#E6A17E" stroke-width="1.5"/>

  <!-- RIGHT CALLOUTS -->
  <!-- A: Tap Ghost -> Action Bar -->
  <rect x="644" y="42" width="248" height="114" rx="11" fill="#23262C" stroke="#E6A17E" stroke-width="1.2"/>
  <text x="660" y="67" class="sans label" fill="#F3C3A8">Tap Ghost → Action Bar</text>
  <rect x="660" y="82" width="68" height="24" rx="6" fill="#2C3038" stroke="#3D4352"/>
  <text x="694" y="98" text-anchor="middle" class="sans tag" fill="#E5E7EB">Upload</text>
  <rect x="734" y="82" width="70" height="24" rx="6" fill="#2C3038" stroke="#3D4352"/>
  <text x="769" y="98" text-anchor="middle" class="sans tag" fill="#E5E7EB">Download</text>
  <rect x="810" y="82" width="66" height="24" rx="6" fill="#2C3038" stroke="#3D4352"/>
  <text x="843" y="98" text-anchor="middle" class="sans tag" fill="#E5E7EB">Image</text>
  <rect x="660" y="116" width="68" height="24" rx="6" fill="#2C3038" stroke="#3D4352"/>
  <text x="694" y="132" text-anchor="middle" class="sans tag" fill="#E5E7EB">History</text>
  <rect x="734" y="116" width="70" height="24" rx="6" fill="#2C3038" stroke="#3D4352"/>
  <text x="769" y="132" text-anchor="middle" class="sans tag" fill="#E5E7EB">Draft</text>
  <rect x="810" y="116" width="66" height="24" rx="6" fill="#2C3038" stroke="#3D4352"/>
  <text x="843" y="132" text-anchor="middle" class="sans tag" fill="#E5E7EB">Menu</text>
  <path d="M 587 184 L 618 184 L 618 99 L 644 99" fill="none" stroke="#E6A17E" stroke-width="1.5"/>

  <!-- B: Hold Ghost -> Shortcut Ring -->
  <rect x="644" y="176" width="248" height="136" rx="11" fill="#23262C" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="662" y="201" class="sans label" fill="#A9C3FF">Hold Ghost → Shortcut Ring</text>
  <!-- Visual mini arc -->
  <path d="M 730 222 A 48 48 0 0 0 730 296" fill="none" stroke="#4B6296" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="716" cy="226" r="15" fill="#1F283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="716" y="230" text-anchor="middle" class="mono tag" fill="#E5E7EB">Esc</text>
  <circle cx="692" cy="259" r="15" fill="#1F283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="692" y="263" text-anchor="middle" class="mono tag" fill="#E5E7EB">Ctrl</text>
  <circle cx="716" cy="292" r="15" fill="#1F283B" stroke="#7AA2F7" stroke-width="1.2"/>
  <text x="716" y="296" text-anchor="middle" class="mono tag" fill="#E5E7EB">Fn</text>
  <text x="762" y="250" class="sans sub">Context-aware</text>
  <text x="762" y="270" class="sans sub">Drag &amp; release</text>
  <text x="762" y="290" class="sans sub">Agent / Shell</text>
  <path d="M 587 196 L 618 196 L 618 244 L 644 244" fill="none" stroke="#7AA2F7" stroke-width="1.5"/>

  <!-- C: Cursor Row Esc/Enter -->
  <rect x="644" y="336" width="248" height="60" rx="11" fill="#23262C" stroke="#E9C46A" stroke-width="1.2"/>
  <text x="662" y="361" class="sans label" fill="#F5D98E">Row-End Pill</text>
  <text x="662" y="381" class="sans sub">Esc while typing · ↵ when idle</text>
  <line x1="568" y1="366" x2="644" y2="366" stroke="#E9C46A" stroke-width="1.5"/>
</svg>
